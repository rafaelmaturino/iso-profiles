; MatuPBX ODBC DSNs (Arch paths).
; Same DSN names as the original SNEP install (res_odbc.conf expects
; dsn => MySQL-snep), only the driver path changes: Arch builds the
; mariadb-connector-odbc driver as /usr/lib/libmariadbodbc.so.

[MySQL-snep]
Description = MariaDB ODBC Driver
Driver      = /usr/lib/libmariadbodbc.so
Socket      = /run/mysqld/mysqld.sock
Server      = localhost
User        = snep
Password    = sneppass
Database    = snep
Option      = 3

[MySQL]
Description = MariaDB ODBC Driver
Driver      = /usr/lib/libmariadbodbc.so
FileUsage   = 1
